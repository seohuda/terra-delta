# Exact official algorithm; thresholds are ignored under argmax.
model:
  encoder: resnet18
  encoder_weights: null
  in_channels: 6
  classes: 3
inference:
  batch_size: 16
  tta: [identity]
  alignment: none
postprocess:
  mode: argmax
  backend: reference
  min_area: 30
  min_pos_area: 20.0
  simplify_px: 0.5
  ndigits: 2
